background {
    path = screenshot
    blur_size = 8
    blur_passes = 2
}

input-field {
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    inner_color = rgba(30, 30, 46, 200)
    outer_color = rgb(137, 180, 250)
    font_color = rgb(205, 214, 244)
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 80
    font_family = Fira Code
    position = 0, -150
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(205, 214, 244, 1.0)
    font_size = 25
    font_family = Fira Code
    position = -30, -110
    halign = center
    valign = top
}
